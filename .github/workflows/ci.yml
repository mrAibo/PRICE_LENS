name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify local extension artifact
        run: npm run verify-artifact -w @price-lens/extension
      - name: Verify production extension artifact
        env:
          PRICE_LENS_API_ORIGIN: https://api.pricelens.invalid
        run: |
          npm run build -w @price-lens/extension
          npm run verify-artifact -w @price-lens/extension
      - name: Smoke-package Chrome ZIP
        run: |
          rm -f apps/extension/price-lens-chrome.zip
          (cd apps/extension/dist && zip -X -q -r ../price-lens-chrome.zip .)
          test "$(unzip -Z1 apps/extension/price-lens-chrome.zip | grep -c '^manifest.json)" -eq 1
          test "$(unzip -Z1 apps/extension/price-lens-chrome.zip | grep -c '^background.js)" -eq 1
          test "$(unzip -Z1 apps/extension/price-lens-chrome.zip | grep -c '^content.js)" -eq 1
