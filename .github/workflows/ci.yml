name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.4
      - name: Upgrade npm
        run: npm install --global npm@11
      - name: Install locked dependencies
        run: npm ci
      - name: Verify dependency licenses
        run: npm run licenses:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Terraform format
        run: terraform fmt -check -diff -recursive infra/gcp
      - name: Terraform init
        run: terraform -chdir=infra/gcp init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/gcp validate
      - name: Verify local extension artifact
        run: npm run verify-artifact -w @price-lens/extension
      - name: Verify production extension artifact
        env:
          PRICE_LENS_API_ORIGIN: https://api.pricelens.invalid
        run: |
          npm run build -w @price-lens/extension
          npm run verify-artifact -w @price-lens/extension
      - name: Smoke-package Chrome ZIP
        run: |
          rm -f apps/extension/price-lens-chrome.zip
          (cd apps/extension/dist && zip -X -q -r ../price-lens-chrome.zip .)
          unzip -Z1 apps/extension/price-lens-chrome.zip | grep -Fxq "manifest.json"
          unzip -Z1 apps/extension/price-lens-chrome.zip | grep -Fxq "background.js"
          unzip -Z1 apps/extension/price-lens-chrome.zip | grep -Fxq "content.js"
      - name: Verify Firefox production artifact
        env:
          PRICE_LENS_API_ORIGIN: https://api.pricelens.invalid
        run: |
          npm run build:firefox -w @price-lens/extension
          npm run verify-artifact:firefox -w @price-lens/extension
      - name: Smoke-package Firefox ZIP
        run: |
          rm -f apps/extension/price-lens-firefox.zip
          (cd apps/extension/dist-firefox && zip -X -q -r ../price-lens-firefox.zip .)
          unzip -Z1 apps/extension/price-lens-firefox.zip | grep -Fxq "manifest.json"
          unzip -Z1 apps/extension/price-lens-firefox.zip | grep -Fxq "background.js"
          unzip -Z1 apps/extension/price-lens-firefox.zip | grep -Fxq "content.js"
      - name: Build production API container
        run: docker build --tag price-lens-api:ci .
      - name: Smoke-test production API container
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:18787:8080 price-lens-api:ci)"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18787/ready >/tmp/price-lens-ready.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container_id"
            exit 1
          fi

          grep -Fq '"status":"ready"' /tmp/price-lens-ready.json
          curl --fail --silent --show-error http://127.0.0.1:18787/health | grep -Fq '"status":"ok"'
